name: Tests (dev to master)

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    if: github.head_ref == 'dev'
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: '4.6.1'}
          - {os: macOS-latest, r: '4.6.1'}
          - {os: ubuntu-latest, r: '4.6.1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      ONNXRUNTIME_LOGLEVEL: 4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create animl_env and install animl-py dev
        shell: bash
        run: |
          VENV_DIR="$HOME/.virtualenvs/animl_env"
          python -m venv "$VENV_DIR"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PYTHON_BIN="$VENV_DIR/Scripts/python.exe"
          else
            PYTHON_BIN="$VENV_DIR/bin/python"
          fi

          "$PYTHON_BIN" -m pip install --upgrade pip
          "$PYTHON_BIN" -m pip install "animl @ git+https://github.com/conservationtechlab/animl-py.git@dev"
          "$PYTHON_BIN" -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

          echo "WORKON_HOME=$HOME/.virtualenvs" >> "$GITHUB_ENV"
          echo "RETICULATE_PYTHON=$PYTHON_BIN" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::testthat

      - name: Run tests
        run: |
          devtools::test(stop_on_failure = TRUE)
        shell: Rscript {0}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.os }}-r${{ matrix.config.r }}-test-results
          path: tests/
